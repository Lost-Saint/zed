name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - v1.17.2
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream Zed tags
        run: git fetch https://github.com/zed-industries/zed.git --tags
      - name: Checkout version
        run: git checkout "${{ matrix.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Build
        run: cargo build --release -p zed
      - name: Package
        run: tar -czf "zed-${{ matrix.version }}-x86_64-unknown-linux-gnu.tar.gz" -C target/release zed
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ matrix.version }}" "zed-${{ matrix.version }}-x86_64-unknown-linux-gnu.tar.gz" --target main --generate-notes
