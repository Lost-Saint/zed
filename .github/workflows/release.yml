name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p zed
      - name: Package
        run: tar -czf "zed-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C target/release zed
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "zed-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" --generate-notes --verify-tag
